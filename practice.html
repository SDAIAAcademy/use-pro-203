<section>
<h2>اليوم 1: أرقام يعاد تشغيلها</h2>
<ol>
<li><p>سألت المساعد عن نسبة أكبر حساب مصروفات من الإجمالي. أجاب بجملة فيها 53.8%، دون رموز ولا صيغة. أعدت الحساب فوجدتها 53.8%. ماذا تضع في تقرير الإقفال؟</p><ul><li><b>أ.</b> رد المساعد، فقد ثبتت صحته</li><li><b>ب.</b> رد المساعد، لأنه رقم محسوب</li><li><b>ج.</b> حسابك أنت، بصيغته أو رموزه</li><li><b>د.</b> رد المساعد بعد أن تسأله مرة ثانية للتأكد</li></ul></li>
<li><p>ملف دفتر الأستاذ فيه 606 أسطر بعدّك. برنامج ولّده المساعد يطبع: 579 متطابقًا و22 غير متطابق في جهة الدفتر. ما أول ما تفعله؟</p><ul><li><b>أ.</b> تبحث في الرموز عن السطر الذي أسقط خمسة أسطر</li><li><b>ب.</b> تصنّف البنود الاثنين والعشرين غير المتطابقة</li><li><b>ج.</b> تسأل المساعد هل حذف شيئًا وتأخذ بجوابه</li><li><b>د.</b> تقبل الناتج لأن الفرق أقل من واحد في المئة</li></ul></li>
<li><p>أربعة بنود بقيت غير متطابقة في 31 أكتوبر. أيها يُعدَّل في جهة البنك من القائمة ولا يحتاج إلى قيد في الدفتر؟</p><ul><li><b>أ.</b> رسوم خدمات مصرفية خصمها البنك في 31 أكتوبر</li><li><b>ب.</b> سداد لمورد ظهر في الدفتر مرتين وفي البنك مرة</li><li><b>ج.</b> شيك من عميل ارتجع في 27 أكتوبر</li><li><b>د.</b> شيك لمورد قُيّد في 30 أكتوبر ولم يُصرف بعد</li></ul></li>
<li><p>تقرير مصروفات العهدة يجمع المبالغ حسب فئة يكتبها عمود فيه دالة ذكاء اصطناعي. الزميل الذي أعدّه يقول إن الأرقام «راجعها أمس وكانت سليمة». ما الذي يجعل التقرير صالحًا للإقفال؟</p><ul><li><b>أ.</b> إيقاف إعادة الحساب التلقائي في الملف</li><li><b>ب.</b> مراجعة التصنيف، ثم لصقه قيمًا، ثم الجمع فوق القيم</li><li><b>ج.</b> تحديث الدالة ثلاث مرات والتأكد من أن الناتج لم يتغير</li><li><b>د.</b> توقيع الزميل على أنه راجع الأرقام أمس</li></ul></li>
<li><p>سألت مساعدًا عن متوسط قيمة فواتير الشهر، فرد: «حسبت المتوسط من الجدول الذي لصقته، وهو 18,420 ريالًا». لا رموز في الرد ولا صيغة. كيف تصنّف هذا الرقم؟</p><ul><li><b>أ.</b> محسوب، لأن المساعد قال إنه حسبه</li><li><b>ب.</b> مولَّد نصًّا، ويُعاد حسابه كله من الجدول</li><li><b>ج.</b> محسوب إن كان الجدول الملصوق صحيحًا</li><li><b>د.</b> مولَّد إن كان خاطئًا، ومحسوب إن كان صحيحًا</li></ul></li>
<li><p>رد المساعد فيه رموز برمجية ومخرجها: «41 صفًّا، المجموع 96,300». في النظام 44 فاتورة لهذا الشهر. ما أول فحص تجريه؟</p><ul><li><b>أ.</b> تعيد جمع الفواتير الأربع والأربعين بالآلة الحاسبة</li><li><b>ب.</b> تطلب من المساعد أن يؤكد أن المجموع صحيح</li><li><b>ج.</b> تقبل المجموع لأن الرموز شُغّلت فعلًا</li><li><b>د.</b> تقرأ شرط التصفية في الرموز لتعرف أي ثلاث فواتير خرجت</li></ul></li>
<li><p>في رد مساعد لا يشغّل رموزًا: «مجموع الحسابات الثلاثة 12,480 و7,915 و3,260 هو 23,565». أعد الحساب دون مساعد. ما المجموع الصحيح؟ <span class="unit">(ريال)</span></p></li>
<li><p>عمود في جدول المصروفات تصنّف خلاياه دالة ذكاء اصطناعي، وفوقه جمع شرطي يدخل تقرير الإقفال. ما الذي يجعل الرقم صالحًا للتقرير؟</p><ul><li><b>أ.</b> مراجعة التصنيف، ثم لصقه قيمًا، ثم الجمع فوق القيم</li><li><b>ب.</b> تحديث الدالة مرتين والتأكد من تطابق الناتجين</li><li><b>ج.</b> كتابة أمر أدق للدالة حتى لا تخطئ</li><li><b>د.</b> حماية الورقة بكلمة مرور</li></ul></li>
<li><p>ملف الدفتر فيه 820 سطرًا بعدّك. برنامج ولّده المساعد يطبع: 790 متطابقًا و24 غير متطابق. ماذا يعني ذلك؟</p><ul><li><b>أ.</b> المطابقة سليمة، والفرق تقريب</li><li><b>ب.</b> ستة أسطر استُخدمت مرتين في المطابقة</li><li><b>ج.</b> ستة أسطر خرجت قبل المطابقة، فتبحث عن السطر الذي أخرجها</li><li><b>د.</b> الملف فيه ستة أسطر فارغة لا تهم</li></ul></li>
<li><p>المجاميع الرقابية اتفقت تمامًا قبل المطابقة وبعدها، عددًا ومبلغًا. ثم وجدت أن البرنامج ربط سدادين لموردين مختلفين لأن مبلغيهما متساويان. ماذا تستنتج عن المجاميع الرقابية؟</p><ul><li><b>أ.</b> أنها تثبت أن كل سطر حُسب مرة واحدة، ولا تثبت أن كل زوج صحيح</li><li><b>ب.</b> أنها لا تنفع، ما دامت لم تكشف الخطأ</li><li><b>ج.</b> أن فيها خطأ حسابيًّا يجب البحث عنه</li><li><b>د.</b> أن المطابقة صحيحة، والموردان سيتسويان بينهما</li></ul></li>
<li><p>بعد المطابقة بقي في كشف البنك سطر «رسوم خدمات مصرفية 150 ريالًا» لا مرجع له في الدفتر. أين يُعالج في قائمة المطابقة؟</p><ul><li><b>أ.</b> في جهة البنك، بندًا ينتظر الشهر القادم</li><li><b>ب.</b> لا يُعالج، لأن المبلغ صغير</li><li><b>ج.</b> في جهة الدفتر، ويُقيَّد مصروفًا</li><li><b>د.</b> في الجهتين معًا حتى يتساوى الرصيدان</li></ul></li>
<li><p>الرصيد الختامي في كشف البنك 512,300 ريال. في الدفتر إيداعات بالطريق مجموعها 18,000 ريال، ومدفوعات لم تُصرف بعد مجموعها 26,500 ريال. ما الرصيد المعدَّل حسب البنك؟ <span class="unit">(ريال)</span></p></li>
<li><p>إذا طبع المساعد في آخر رده «تحققت من المجاميع وهي متفقة» فقد ثبت اتفاق المجاميع الرقابية.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>عمود في نموذج موازنة كله صيغ. حين تعرض السوابق تخرج الأسهم من كل خلاياه إلا واحدة. ما التفسير الأرجح؟</p><ul><li><b>أ.</b> الخلية فيها صيغة أطول من غيرها</li><li><b>ب.</b> الخلية محمية من التعديل</li><li><b>ج.</b> أداة التتبع تعطلت عند هذه الخلية</li><li><b>د.</b> رقم كُتب باليد فوق الصيغة</li></ul></li>
<li><p>لماذا تُحسب الحالات اليدوية من المواصفة بآلة حاسبة، وقبل النظر إلى أرقام النموذج، ودون مساعد؟</p><ul><li><b>أ.</b> لأن الآلة الحاسبة أدق من جدول البيانات</li><li><b>ب.</b> لأن قيمتها في استقلالها عن النموذج وعن المساعد</li><li><b>ج.</b> لأن المساعد ممنوع في أعمال الموازنة كلها</li><li><b>د.</b> لأن النموذج قد يكون محميًّا فلا يُقرأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: التعليق والعينة وإعادة التصميم</h2>
<ol>
<li><p>طابقت ملفين برموز ولّدها المساعد. المتطابق وغير المتطابق يساويان كل ملف، عددًا ومبلغًا. ما الذي ثبت بذلك؟</p><ul><li><b>أ.</b> أن كل زوج متطابق هو الزوج الصحيح</li><li><b>ب.</b> أن الملفين صحيحان وليس فيهما خطأ</li><li><b>ج.</b> أن كل سطر حُسب مرة واحدة: لا ضائع ولا مكرر</li><li><b>د.</b> أن المطابقة انتهت ولا بنود تحتاج إلى نظر</li></ul></li>
<li><p>أصلحت عمود الاشتراكات، ونجح اختباره مقابل حالتك اليدوية. ثم لاحظت أن إجمالي الموازنة قفز بأكثر مما توقعت. ما الخطوة التالية؟</p><ul><li><b>أ.</b> تعيد الصيغة القديمة، فالإجمالي كان أقرب إلى المعتاد</li><li><b>ب.</b> تنظر إلى كل الاختبارات، وتحسب القفزة المتوقعة من الإصلاح</li><li><b>ج.</b> تسأل المساعد عن سبب القفزة وتكتب جوابه في السجل</li><li><b>د.</b> تسجّل الإصلاح وتنتقل إلى الخطأ التالي</li></ul></li>
<li><p>في المسودة: «تجاوز مركز النظافة موازنته بسبب ارتفاع أسعار المواد لدى الموردين خلال الربع». الرقم يطابق خليته. لا ملاحظة من صاحب المركز. ماذا يدخل التعليق النهائي؟</p><ul><li><b>أ.</b> الجملة كما هي، فالسبب معقول والرقم صحيح</li><li><b>ب.</b> لا شيء: يُحذف المركز حتى يُعرف السبب</li><li><b>ج.</b> الجملة، بعد أن تسأل المساعد عن مصدر السبب</li><li><b>د.</b> الرقم بخليته، و«السبب غير موثق: يُسأل صاحب المركز»</li></ul></li>
<li><p>رفعت ملف الفواتير إلى مساعد وطلبت 60 فاتورة عشوائية. رد بقائمة من 60 رقمًا دون رموز. تأكدت أن الأرقام كلها موجودة في الملف. هل تصلح عينة تدقيق؟</p><ul><li><b>أ.</b> لا: تسحبها من جديد بطريقة مكتوبة وبذرة مسجَّلة</li><li><b>ب.</b> نعم، ما دامت الأرقام كلها موجودة</li><li><b>ج.</b> نعم، إذا كتبت في الملف أن المساعد اختارها</li><li><b>د.</b> نعم، إذا بدت موزعة على الأشهر والموردين</li></ul></li>
<li><p>في شركة ظِلال تريد من المساعد المعتمد أن يكتب رموزًا تقارن رواتب كل مركز تكلفة بموازنته. سجل أدوات الشركة يسمح له ببيانات «مقيد» دون بيانات شخصية. المسير فيه أسماء وهويات وحسابات بنكية. ما التصميم المقبول؟</p><ul><li><b>أ.</b> ترفع المسير كما هو، فالمساعد معتمد</li><li><b>ب.</b> ترفع المسير بعد حذف عمود الأسماء</li><li><b>ج.</b> تجمّع الرواتب حسب المركز محليًّا، وترفع المجاميع</li><li><b>د.</b> ترفع المسير إلى مساعد عام لأن المهمة بسيطة</li></ul></li>
<li><p>أصلحت صيغة الاشتراكات فنجح اختبارها. ثم لاحظت أن إجمالي الموازنة تغيّر بأكثر مما يفسره هذا الإصلاح. ما الخطوة الصحيحة؟</p><ul><li><b>أ.</b> تسجّل الإصلاح في سجل التغييرات وتنتقل إلى الخطأ التالي</li><li><b>ب.</b> تعيد الصيغة القديمة لأن الإجمالي كان أقرب إلى موازنة السنة الماضية</li><li><b>ج.</b> تشغّل كل الاختبارات والفحص الرقابي للإجمالي قبل أي إصلاح آخر</li><li><b>د.</b> تطلب من المساعد أن يشرح سبب تغيّر الإجمالي وتأخذ بشرحه</li></ul></li>
<li><p>في مختبر إصلاح النموذج عرض عليك المساعد: «أرفقت نسخة مُصلَحة من الملف». سياسة المختبر أن المساعد معلّم. ماذا تفعل؟</p><ul><li><b>أ.</b> تطلب شرح كل تغيير، وتطبّق الإصلاحات بيدك مع اختبار لكل منها</li><li><b>ب.</b> تستخدم النسخة المرفقة وتتحقق من الإجمالي فقط</li><li><b>ج.</b> ترفض استخدام المساعد في بقية المختبر</li><li><b>د.</b> تستخدم النسخة المرفقة وتكتب في سجل التغييرات «أصلحه المساعد»</li></ul></li>
<li><p>في مسودة تعليق كتبها المساعد: «تجاوز المركز موازنته بنسبة 18.2% [Variance!F9]». الخلية F9 تعرض 12.8%. ما التصحيح؟</p><ul><li><b>أ.</b> تطلب من المساعد أن يعيد حساب النسبة</li><li><b>ب.</b> تحذف عنوان الخلية وتبقي النسبة</li><li><b>ج.</b> تكتب في التعليق النسبة التي في الخلية</li><li><b>د.</b> تغيّر الخلية لتطابق التعليق</li></ul></li>
<li><p>مسودة المساعد تقول إن تجاوز مركز النظافة «بسبب ارتفاع أسعار المواد لدى الموردين». لا ملاحظة من صاحب المركز ولا مستند. كيف يظهر السبب في التعليق النهائي؟</p><ul><li><b>أ.</b> كما هو، فهو تفسير معقول</li><li><b>ب.</b> يُحذف المركز من التعليق حتى يُعرف السبب</li><li><b>ج.</b> بعد سؤال المساعد عن مصدر المعلومة</li><li><b>د.</b> «السبب غير موثق: يُسأل صاحب المركز»</li></ul></li>
<li><p>طلبت من مساعد محادثة: «اختر 40 فاتورة عشوائية من الملف المرفق». أعطاك قائمة من 40 رقمًا. ما المشكلة الأساسية في استخدامها عينة تدقيق؟</p><ul><li><b>أ.</b> أن حجمها صغير</li><li><b>ب.</b> أن لا أحد يستطيع إعادة سحبها ولا إثبات كيف اختيرت</li><li><b>ج.</b> أن المساعد قد يكون اختار فواتير صغيرة المبلغ</li><li><b>د.</b> أن القائمة تحتاج إلى ترتيب تصاعدي</li></ul></li>
<li><p>الباقي بعد البنود الرئيسة 2,400 فاتورة، وحجم العينة 40، والاختيار منتظم ببداية عشوائية. العدد العشوائي الأول من البذرة 0.35. البداية = الجزء الصحيح من (العدد العشوائي × الفترة) + 1. ما رقم موضع أول فاتورة في العينة؟ <span class="unit">(الموضع)</span></p></li>
<li><p>الدفتر المعدّ أظهر أن فاتورة في العينة بلا أمر شراء. من يحكم بأنها استثناء، وعلى أي أساس؟</p><ul><li><b>أ.</b> الدفتر، لأن الاختبار محسوب</li><li><b>ب.</b> المساعد، بعد أن يُعطى سياسة المشتريات</li><li><b>ج.</b> المدقق، بعد قراءة مستندات الفاتورة</li><li><b>د.</b> لا أحد: كل بند يظهر في الاختبار استثناء</li></ul></li>
<li><p>مهمتك المتكررة في شركة ظِلال، وهي جهة خاصة، مراجعة مسير الرواتب، وفيه أسماء وأرقام هويات وحسابات بنكية. سجل أدوات الشركة يسمح للمساعد المعتمد ببيانات «مقيد» دون بيانات شخصية، وللمساعدات العامة ببيانات «عام» فقط. ما التصميم المقبول؟</p><ul><li><b>أ.</b> رفع الملف كما هو إلى المساعد المعتمد، فهو معتمد</li><li><b>ب.</b> رفع الملف إلى مساعد عام بعد حذف عمود الأسماء فقط</li><li><b>ج.</b> ترك المهمة يدوية كلها، فلا مكان للذكاء الاصطناعي فيها</li><li><b>د.</b> العمل بالأدوات المحلية، أو بملف مجمَّع بلا أسماء ولا هويات ولا حسابات في المساعد المعتمد</li></ul></li>
<li><p>خط الأساس لمهمة: 50 دقيقة وخطآن في المتوسط. بعد إعادة التصميم: 20 دقيقة وأربعة أخطاء. كيف تصف النتيجة في بطاقتك؟</p><ul><li><b>أ.</b> تحسّن واضح: الوقت نقص 60%</li><li><b>ب.</b> أسرع وأقل صحة: إعادة التصميم لم تنجح بعد، وتبحث عن مصدر الأخطاء</li><li><b>ج.</b> النتيجتان متعادلتان، فالوقت يعوّض الأخطاء</li><li><b>د.</b> تحذف عمود الأخطاء لأن القياس لم يكن عادلًا</li></ul></li>
<li><p>في بطاقتك ثلاثة قياسات لخط الأساس وقياس واحد بعد إعادة التصميم، كلها لك أنت. ما أصدق جملة تكتبها تحت «ما لا تقوله هذه الأرقام»؟</p><ul><li><b>أ.</b> لا شيء: الأرقام تتحدث عن نفسها</li><li><b>ب.</b> أن الفرق مؤشر من شخص واحد وتنفيذ واحد، وأن التنفيذ الثاني قد يختلف</li><li><b>ج.</b> أن الطريقة الجديدة ستوفر الوقت نفسه لكل الزملاء</li><li><b>د.</b> أن القياس غير صالح ويجب إهماله</li></ul></li>
</ol>
</section>

"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-samp-03","type":"single","prompt":"الدفتر المعدّ أظهر أن فاتورة في العينة بلا أمر شراء. من يحكم بأنها استثناء، وعلى أي أساس؟","options":[{"key":"أ","text":"الدفتر، لأن الاختبار محسوب"},{"key":"ب","text":"المساعد، بعد أن يُعطى سياسة المشتريات"},{"key":"ج","text":"المدقق، بعد قراءة مستندات الفاتورة"},{"key":"د","text":"لا أحد: كل بند يظهر في الاختبار استثناء"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"الاختبار المحسوب يحدد بنودًا للنظر. هل هي استثناء، وما سببه وأثره، حكم مهني يوقّع عليه المدقق.","misconceptions":["يمدّ الحساب إلى الحكم: الاختبار يقول إن الحقل فارغ، ولا يقول لماذا","يفوّض الحكم المهني: المساعد لا يرى المستندات ولا يتحمل نتيجة التقرير","","يساوي بين «بند للنظر» و«استثناء»: بعض المشتريات معفاة من أمر الشراء بنص السياسة"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-redesign-01","type":"single","prompt":"مهمتك المتكررة في شركة ظِلال، وهي جهة خاصة، مراجعة مسير الرواتب، وفيه أسماء وأرقام هويات وحسابات بنكية. سجل أدوات الشركة يسمح للمساعد المعتمد ببيانات «مقيد» دون بيانات شخصية، وللمساعدات العامة ببيانات «عام» فقط. ما التصميم المقبول؟","options":[{"key":"أ","text":"رفع الملف كما هو إلى المساعد المعتمد، فهو معتمد"},{"key":"ب","text":"رفع الملف إلى مساعد عام بعد حذف عمود الأسماء فقط"},{"key":"ج","text":"ترك المهمة يدوية كلها، فلا مكان للذكاء الاصطناعي فيها"},{"key":"د","text":"العمل بالأدوات المحلية، أو بملف مجمَّع بلا أسماء ولا هويات ولا حسابات في المساعد المعتمد"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"تصنيف الملف ووجود بيانات شخصية فيه يحددان الأداة قبل أي تصميم. ما يُعطى للمساعد يُسجَّل في سجل الاستخدام.","misconceptions":["يقرأ «معتمد» إذنًا مطلقًا: الاعتماد له حدود في السجل، والبيانات الشخصية خارجها","يظن أن حذف الاسم يزيل الصفة الشخصية: الهوية والحساب البنكي يدلان على الشخص، والملف ليس «عام» في كل حال","يرى الخيارين رفعًا كاملًا أو لا شيء: الأدوات المحلية والملف
